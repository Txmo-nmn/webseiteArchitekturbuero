<!-- DATENMASKE-->


<div id="datenMaske" class="maske">

    <table>

            <th>Name</th>

            <th>Telefonnummer</th>
            <th>Geschäfts-Email</th>
            <th>Bild</th>
            <th id="zweiKnöpfe">Knöpfe</th>
        </tr>
        </thead>
        <tbody id="datenMaskeZeilen">

        </tbody>

    <button id="anlegeButton" onclick="wechselnMaske('eingabeMaske','anlegen')"> Anlegen</button>
</div>

<!-- DATENMASKE

<div id="datenMaskeZeilen"></div>
-->
<script>
    function wechselnMaske(sichtbareMaske, mode) {
        console.log("wechselnMaske mit " + sichtbareMaske);
        $(".maske").hide();
        $("#eingabeMaske input[type='text']").val("");
        if (mode !== undefined) {
            if (mode === "anlegen") {
                //Anlegen
                $("#eingabeMaske input[type='text']").val("");
                $("#eingabeForm").attr("action", "javascript:anlegenImArray()");
                $("#eingabeMaske h2").html("Lege einen neuen Mitarbeiter an")
            } else {
                //Aendern
                var name = datenArray[mode].name;
                var verfuegbarkeit = datenArray[mode].verfuegbarkeit;
                var stil = datenArray[mode].stil;
                var spezialisierung = datenArray[mode].spezialisierung;
                var erfahrung = datenArray[mode].erfahrung;
                var telefonnummer=datenArray[mode].telnummer;
                var email=datenArray[mode].email;
                var bild=datenArray[mode].bild;
                $("#nameInput").val(name);
                $("#verfuegbarkeitInput").val(verfuegbarkeit);
                $("#stilInput").val(stil);
                $("#spezialisierungInput").val(spezialisierung);
                $("#erfahrungInput").val(erfahrung);
                $("#telefonnummerInput").val(telefonnummer);
                $("#emailInput").val(email);
                $("#bildInput").val(bild);
                $("#eingabeForm").attr("action", "javascript:aendernImArray(" +
                    mode +
                    ")");
               $("#eingabeMaske h2").html(`Ändere den Mitarbeiter ${name}`)
            }
        }
        $("#" + sichtbareMaske).show();
    }

    //AUSBLENDEN EINES ELEMENTS(AKTUELL BUTTON) ÜBER DIE ZUGEHÖRIGE ID
    function nichtsichtbar(idinput) {
        console.log(` Auruf der Funktion nichtsichtbar mit der ID
             ${idinput}`)

        $('#' + idinput).css('display', 'none');


    }

    //EINBLENDEN EINES ELEMENTS(AKTUELL BUTTON) ÜBER DIE ZUGEHÖRIGE ID
    function sichtbar(idinput) {
        console.log(` Auruf der Funktion sichtbar mit der ID ${idinput}`)
        $('#' + idinput).css('display', 'block');
    }

    //AUSBLENDEN ALLER ELEMENTE (KNÖPFE) MIT DER KLASSE "KNOPF"
    function wechselnKnopfaus() {
        console.log(` Auruf der Funktion wechselKnopfaus`)

        $('.knopf').css('display', 'none');
    }

    //EINBLENDEN ALLER ELEMENTE (KNÖPFE) MIT DER KLASSE "KNOPF"
    function wechselnKnopfan() {
        console.log(` Auruf der Funktion wechselKnopfan`)

        $('.knopf').css('display', 'block');


    }

    //DIESE FUNKTION RUFT AM ANFANG ALLE FUNKTIONEN MIT DEN ZUGEHÖRIGEN ÜBERGABEWERTEN AUF DASS ALLES AM ANFNAG PASST
    function start() {
        lesenAusArray();
        wechselnKnopfaus();
        nichtsichtbar("zweiKnöpfe");
        wechselnMaske("datenMaske");
        nichtsichtbar("anlegeButton");
        nichtsichtbar("auslogButton");

    }
    //DIESE FUNKTION RUFT ALLE GENNANTEN FUNKTIONEN AUF WENN MAN AUF AUSLOGGEN KLICKT
function buttonausloggen() {
        wechselnMaske('datenMaske');nichtsichtbar('anlegeButton');
    wechselnKnopfaus();sichtbar('einlogButton');nichtsichtbar('auslogButton');nichtsichtbar('zweiKnöpfe');
    }

    //DIESE FUNKTION RUFT ALLE GENNANTEN FUNKTIONEN AUF WENN MAN AUF EINLOGGEN KLICKT
    function buttoneinloggen() {
        wechselnMaske('datenMaske');sichtbar('anlegeButton');sichtbar('auslogButton');nichtsichtbar('einlogButton');wechselnKnopfan();sichtbar('zweiKnöpfe');
    }
//KONSTRUKTOR
    function Mitarbeiter(name, verfuegbarkeit, stil, spezialisierung, erfahrung, telnummer, email, bild) {
        console.log(` Auruf des Konstruktors Mitarbeiter mit
             ${name},
             ${verfuegbarkeit},
             ${stil},
             ${spezialisierung},
             ${erfahrung},
             ${telnummer},
             ${email},
             ${bild},`);

        this.name = name;
        this.verfuegbarkeit = verfuegbarkeit;
        this.stil = stil;
        this.spezialisierung = spezialisierung;
        this.erfahrung = erfahrung;
        this.telnummer = telnummer;
        this.email = email;
        this.bild = bild;

    }

    var datenArray = new Array();

    datenArray[0] = new Mitarbeiter("Mark Miller", "Verfügbar", "Barrock", "Bad", "20 Jahre", "0176373893", " mark.miller@architekt.de", "pics/mark.jpeg");
    datenArray[1] = new Mitarbeiter("Michael Jäger", "nicht Verfügbar", "Jugendstil", "Wohnzimmer", "2 Jahre", "054673733", " michael.jaeger@architekt.de", "pics/michael.jpeg");
    datenArray[2] = new Mitarbeiter("Maria Magdalena", "Verfügbar", "Neo", "Garten", "10 Jahre", " 01790383 ", "  maria.magdalena@architekt.de", "pics/Maraia.jpg");

    console.table(datenArray);

    function lesenAusArray() {
        console.log("lesenAusArray");

        $("#datenMaskeZeilen").empty();


        for (var i = 0; i < datenArray.length; i++) {
            var myHTML = `<tr>

                            <td>${datenArray[i].name}</td>
                            <td>${datenArray[i].verfuegbarkeit}</td>
                            <td>${datenArray[i].stil}</td>
                            <td>${datenArray[i].spezialisierung}</td>
                            <td>${datenArray[i].erfahrung}</td>
                            <td>${datenArray[i].telnummer}</td>
                            <td>${datenArray[i].email}</td>
                            <td> <img class="kleiner" src=" ${datenArray[i].bild}"></td>
                            <td>
                <button class="knopf" onclick="loeschenImArray(${i})"> Löschen</button>
               <button class="knopf" onclick="wechselnMaske('eingabeMaske', ${i})"> Ändern</button>
            </td>
 </tr>`
            $('#datenMaskeZeilen').append(myHTML);


        }
    }
    function lesenAusArray2() {
        console.log("lesenAusArray");

        $("#datenMaskeZeilen").empty();


        for (var i = 0; i < datenArray.length; i++) {
            var myHTML = `<div>

                            <div>${datenArray[i].name}</div>
                            <div>${datenArray[i].verfuegbarkeit}</div>
                            <div>${datenArray[i].stil}</div>
                            <div>${datenArray[i].spezialisierung}</div>
                            <div>${datenArray[i].erfahrung}</div>
                            <div>${datenArray[i].telnummer}</div>
                            <div>${datenArray[i].email}</div>
                            <div> <img class="kleiner" src=" ${datenArray[i].bild}"></div>
                            <div>
                <button class="knopf" onclick="loeschenImArray(${i})"> Löschen</button>
                <button class="knopf" onclick="wechselnMaske('eingabeMaske', ${i})"> Ändern</button>
            </div>
 </div>`
            $('#datenMaskeZeilen').append(myHTML);


        }
    }
//DIESE FUNKTION LEGT EIN NEUES OBJEKT IM ARRAY AN LETZER STELLE AN
    function anlegenImArray() {
        console.log(`Aufruf der Funktion anlegenImArray mit   ${name},
                        ${verfuegbarkeit},
                        ${stil},
                        ${spezialisierung},
                        ${erfahrung},
                        ${telnummer}
                        ${email},
                        ${bild}`);



        var name = $('#nameInput').val();
        var verfuegbarkeit = $('#verfuegbarkeitInput').val();
        var stil = $('#stilInput').val();
        var spezialisierung = $('#spezialisierungInput').val();
        var erfahrung = $('#erfahrungInput').val();
        var telnummer = $('#telefonnummerInput').val();
        var email = $('#emailInput').val();
        var bild = $('#bildInput').val();

        var neuerMitarbeiter = new Mitarbeiter(name,verfuegbarkeit,stil, spezialisierung, erfahrung, telnummer,email,bild);
datenArray.push(neuerMitarbeiter);
console.table(datenArray);
lesenAusArray();
wechselnMaske('datenMaske');


    }
//DIESE FUNKTION ÄNDERT AN DER JEWEILS AUSGEWÄHLTEN STELLE IM ARRAY EIN OBJKET
    function aendernImArray(stelle) {
        console.log(`Aufruf der Funktion aendernMitarbeiter an der ${stelle}`);

        var name = $('#nameInput').val();
        var verfuegbarkeit = $('#verfuegbarkeitInput').val();
        var stil = $('#stilInput').val();
        var spezialisierung = $('#spezialisierungInput').val();
        var erfahrung = $('#erfahrungInput').val();
        var telnummer = $('#telefonnummerInput').val();
        var email = $('#emailInput').val();
        var bild = $('#bildInput').val();

        var neuerMitarbeiter = new Mitarbeiter(name,verfuegbarkeit,stil, spezialisierung, erfahrung, telnummer,email,bild);
datenArray[stelle] = neuerMitarbeiter;
lesenAusArray();
wechselnMaske('datenMaske');
    }

//DIESE FUNKTION LOESCHT AN DER JEWEILS AUSGEWÄHLTEN STELLE IM ARRAY EIN OBJEKT NACH ÜBERPRÜFUNG
    function loeschenImArray(index) {
        console.log("loeschenImArray mit " + index);
        var entscheidung = confirm(`Wollen sie wirkklich den Mitarbeiter ${datenArray[index].name} löschen?`);
        console.log("USER wollte loeschen mit " + entscheidung);
        if (entscheidung) {
//loeschen
            console.log(`Der Mitarbeiter ${datenArray[index].name} wurde gelöscht?`);
            datenArray.splice(index, 1);
            console.table(datenArray);

        } else {
//nichts machen
        }
        //Aktualisieren der Datenmaske
        lesenAusArray();
    }


    //AUFRUF DER FUNKTION START()
    start();
</script>
